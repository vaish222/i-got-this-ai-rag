[project]
name = "i-got-this-ai-rag"
version = "0.1.0"
description = "A privacy-first personal and family RAG assistant"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=6.29",
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-ollama>=1.0",
    "langchain-pinecone>=0.2",
    "langchain-text-splitters>=1.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
]

[tool.uv]
package = false
